# Redis configuration for Brain system
bind 0.0.0.0
port 6379

# Memory management
maxmemory 1gb
maxmemory-policy allkeys-lru

# Persistence (AOF + RDB for durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Performance
hz 20
activerehashing yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

# Security (set password via environment in production)
# requirepass ${REDIS_PASSWORD}

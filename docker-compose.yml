
# ═══════════════════════════════════════════════════════════════════════════════
# BRAIN SYSTEM — COMPLETE DOCKER COMPOSE
# ═══════════════════════════════════════════════════════════════════════════════
#
# PROFILES:
#   (none)     — all core services (19 brain regions + databases)
#   --profile vision  — add camera/CLIP visual memory service
#   --profile full    — everything including vision
#
# STARTUP:
#   docker compose up -d                    ← core system
#   docker compose --profile vision up -d   ← core + vision
#   docker compose --profile full up -d     ← everything
#
# REDEPLOY (preserves all data):
#   docker compose pull              (if using pre-built images)
#   docker compose build --no-cache  (rebuild from source)
#   docker compose up -d             (rolling restart, zero downtime)
#
# FULL RESET (wipes all data, fresh start):
#   docker compose down -v           ← removes all volumes
#   docker compose up -d
#
# SINGLE SERVICE UPDATE:
#   docker compose build <service>
#   docker compose up -d --no-deps <service>
#
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  brain-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  # Database storage — NEVER wipe these without intent
  edgedb-data:
    driver: local
  elasticsearch-data:
    driver: local
  redis-data:
    driver: local

  # Model storage — persists downloaded HuggingFace models
  models-volume:
    driver: local

  # Shared workspace — training logs, replay buffer, supergrokie staging, pending changes
  workspace-volume:
    driver: local

  # Vision frame storage (only used with vision profile)
  frames-volume:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# x-common: shared config fragments (DRY)
# ─────────────────────────────────────────────────────────────────────────────
x-common-healthcheck: &common-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

x-common-restart: &common-restart
  restart: unless-stopped

x-common-network: &common-network
  networks:
    - brain-net

x-common-env: &common-env
  env_file: .env

# Allow containers to reach Ollama on the host (needed for Linux native Docker)
x-common-extra-hosts: &common-extra-hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # API GATEWAY
  # ═══════════════════════════════════════════════════════════════════════════
  gateway:
    image: nginx:alpine
    container_name: brain_gateway
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      thalamus:
        condition: service_healthy
      knobs:
        condition: service_healthy
    <<: [*common-network, *common-restart]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      <<: *common-healthcheck

  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASES
  # ═══════════════════════════════════════════════════════════════════════════

  redis:
    build:
      context: databases/redis
      dockerfile: Dockerfile
    container_name: brain_redis
    volumes:
      - redis-data:/data
    <<: [*common-network, *common-restart]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  elasticsearch:
    build:
      context: databases/elasticsearch
      dockerfile: Dockerfile
    container_name: brain_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}
      - cluster.name=brain-neocortex
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    <<: [*common-network, *common-restart]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  edgedb:
    build:
      context: databases/edgedb
      dockerfile: Dockerfile
    container_name: brain_edgedb
    environment:
      - EDGEDB_SERVER_SECURITY=insecure_dev_mode
      - EDGEDB_SERVER_BIND_ADDRESS=0.0.0.0
      - EDGEDB_CLIENT_TLS_SECURITY=insecure
    volumes:
      - edgedb-data:/var/lib/edgedb/data
      - ./databases/edgedb/schema:/dbschema
    <<: [*common-network, *common-restart]
    healthcheck:
      test: ["CMD-SHELL", "edgedb query --dsn edgedb://localhost:5656 --tls-security=insecure 'SELECT 1' 2>/dev/null && echo ok"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s

  # ── Database Initializer ───────────────────────────────────────────────────
  # Idempotent: safe to run on every deploy. All scripts check before creating.
  # Creates indices, applies schema migrations, seeds base data.
  db-init:
    build:
      context: ./databases
      dockerfile: Dockerfile.init
    container_name: brain_db_init
    command: >
      sh -c "
        echo '--- Redis init ---' &&
        python /init/redis/init.py &&
        echo '--- Elasticsearch init ---' &&
        python /init/elasticsearch/init.py &&
        echo '--- EdgeDB init ---' &&
        python /init/edgedb/init.py &&
        echo '=== All databases initialized ==='
      "
    volumes:
      - ./databases:/init:ro
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - EDGEDB_DSN=${EDGEDB_DSN:-edgedb://edgedb/main}
      - EDGEDB_CLIENT_TLS_SECURITY=insecure
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      edgedb:
        condition: service_healthy
    <<: *common-network
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════════════
  # CORE BRAIN REGIONS
  # ═══════════════════════════════════════════════════════════════════════════

  amygdala:
    build:
      context: .
      dockerfile: services/amygdala/Dockerfile
    container_name: brain_amygdala
    <<: [*common-env, *common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      <<: *common-healthcheck

  hippocampus:
    build:
      context: .
      dockerfile: services/hippocampus/Dockerfile
    container_name: brain_hippocampus
    <<: [*common-env, *common-network, *common-restart, *common-extra-hosts]
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      edgedb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      <<: *common-healthcheck

  neocortex:
    build:
      context: .
      dockerfile: services/neocortex/Dockerfile
    container_name: brain_neocortex
    <<: [*common-env, *common-network, *common-restart, *common-extra-hosts]
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      <<: *common-healthcheck

  cerebellum:
    build:
      context: .
      dockerfile: services/cerebellum/Dockerfile
    container_name: brain_cerebellum
    <<: [*common-env, *common-network, *common-restart, *common-extra-hosts]
    depends_on:
      edgedb:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      <<: *common-healthcheck

  working-memory:
    build:
      context: .
      dockerfile: services/working-memory/Dockerfile
    container_name: brain_working_memory
    <<: [*common-env, *common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      <<: *common-healthcheck

  perception:
    build:
      context: .
      dockerfile: services/perception/Dockerfile
    container_name: brain_perception
    <<: [*common-env, *common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
      neocortex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      <<: *common-healthcheck

  verification:
    build:
      context: .
      dockerfile: services/verification/Dockerfile
    container_name: brain_verification
    <<: [*common-env, *common-network, *common-restart, *common-extra-hosts]
    depends_on:
      redis:
        condition: service_healthy
      neocortex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      <<: *common-healthcheck

  cross-domain:
    build:
      context: .
      dockerfile: services/cross-domain/Dockerfile
    container_name: brain_cross_domain
    <<: [*common-env, *common-network, *common-restart, *common-extra-hosts]
    depends_on:
      redis:
        condition: service_healthy
      neocortex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      <<: *common-healthcheck

  compass:
    build:
      context: .
      dockerfile: services/compass/Dockerfile
    container_name: brain_compass
    <<: [*common-env, *common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health')"]
      <<: *common-healthcheck

  framework-router:
    build:
      context: .
      dockerfile: services/framework-router/Dockerfile
    container_name: brain_framework_router
    <<: [*common-env, *common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      <<: *common-healthcheck

  knobs:
    build:
      context: .
      dockerfile: services/knobs/Dockerfile
    container_name: brain_knobs
    ports:
      - "${KNOBS_PORT:-8090}:8090"
    <<: [*common-env, *common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      <<: *common-healthcheck

  # ── Self-Update (supergrokie-powered code modification) ──────────────────────
  # IMPORTANT: First build takes 5-15 minutes.
  # Use build cache: docker compose build self-update (not --no-cache) to reuse.
  # To pin supergrokie version: set SUPERGROKIE_GIT_REF=<commit-sha> in .env
  self-update:
    build:
      context: .
      dockerfile: services/self-update/Dockerfile
      args:
        # Reproducible builds: pin this to a commit SHA once supergrokie stabilises
        SUPERGROKIE_GIT_REF: ${SUPERGROKIE_GIT_REF:-main}
    container_name: brain_self_update
    environment:
      - SUPERGROKIE_PATH=${SUPERGROKIE_PATH:-/usr/local/bin/supergrokie}
      - SERVICES_DIR=/services
      - WORKSPACE_PATH=/workspace
      - REDIS_URL=${REDIS_URL}
      - KNOBS_URL=${KNOBS_URL}
      - CEREBELLUM_URL=${CEREBELLUM_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - SUPERGROKIE_WEBHOOK_SECRET=${SUPERGROKIE_WEBHOOK_SECRET}
      - AUTO_APPLY_CODE_CHANGES=${AUTO_APPLY_CODE_CHANGES:-false}
      - CODE_REVIEW_REQUIRED=${CODE_REVIEW_REQUIRED:-true}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
    volumes:
      # Persistent workspace: training logs, pending changes, supergrokie staging
      - workspace-volume:/workspace
      # Docker socket: allows self-update to restart containers after code changes
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount services directory: supergrokie reads and writes actual service files
      # rw because supergrokie will write the modified code back here
      - ./services:/services:rw
      # Root SUPERGROKIE.md: architecture context available at filesystem root
      - ./SUPERGROKIE.md:/SUPERGROKIE.md:ro
    depends_on:
      redis:
        condition: service_healthy
      knobs:
        condition: service_healthy
    <<: [*common-network, *common-restart]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════════════════
  # EXTENDED COGNITIVE SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  causal-graph:
    build:
      context: .
      dockerfile: services/causal-graph/Dockerfile
    container_name: brain_causal_graph
    <<: [*common-env, *common-network, *common-restart, *common-extra-hosts]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health')"]
      <<: *common-healthcheck

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    container_name: brain_simulator
    <<: [*common-env, *common-network, *common-restart]
    # No external dependencies — pure sandboxed Python execution
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8013/health')"]
      <<: *common-healthcheck

  metacognition:
    build:
      context: .
      dockerfile: services/metacognition/Dockerfile
    container_name: brain_metacognition
    environment:
      - REDIS_URL=${REDIS_URL}
      - HIPPOCAMPUS_URL=${HIPPOCAMPUS_URL}
      - NEOCORTEX_URL=${NEOCORTEX_URL}
      - CROSS_DOMAIN_URL=${CROSS_DOMAIN_URL}
      - CEREBELLUM_URL=${CEREBELLUM_URL}
    <<: [*common-env, *common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
      neocortex:
        condition: service_healthy
      hippocampus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8014/health')"]
      <<: *common-healthcheck

  goals:
    build:
      context: .
      dockerfile: services/goals/Dockerfile
    container_name: brain_goals
    <<: [*common-env, *common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8015/health')"]
      <<: *common-healthcheck

  # ── Learner (local model — heavy, 4-8GB RAM / 2-4GB VRAM) ──────────────────
  # Model downloads on first start (10-30 min). Subsequent starts are instant.
  # GPU: auto-detected. Set LEARNER_GPU=false in .env to force CPU-only.
  # Watch: docker compose logs -f learner
  learner:
    build:
      context: .
      dockerfile: services/learner/Dockerfile
      args:
        # Override with https://download.pytorch.org/whl/cpu for CPU-only builds
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu121}
    container_name: brain_learner
    environment:
      - PYTHONUNBUFFERED=1
      - LOCAL_MODEL_NAME=${LOCAL_MODEL_NAME:-microsoft/phi-4-mini-instruct}
      - LOCAL_MODEL_PATH=/models/local_llm
      - ADAPTER_PATH=/models/adapters
      - EMOTION_MODEL_PATH=/models/emotion
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/models/hf_cache
      - REDIS_URL=${REDIS_URL}
      - WORKSPACE_PATH=/workspace
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      # models-volume persists downloaded models — do NOT wipe casually
      - models-volume:/models
      - workspace-volume:/workspace
    <<: [*common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
    # GPU reservation lives in docker-compose.gpu.yml (loaded by skynet.sh in GPU mode).
    # Without it the learner auto-detects CUDA at runtime and falls back to CPU.
    deploy:
      resources:
        limits:
          memory: ${LEARNER_MAX_MEMORY:-16g}
        reservations:
          memory: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8016/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s

  # ── Vision (optional — requires camera or can use image upload) ────────────
  # Enable: docker compose --profile vision up -d
  # Or set in .env: VISION_ENABLED=true
  # Camera: requires /dev/video0 on host. Remove the devices section if no camera.
  vision:
    profiles:
      - vision
      - full
    build:
      context: .
      dockerfile: services/vision/Dockerfile
    container_name: brain_vision
    environment:
      - VISION_ENABLED=${VISION_ENABLED:-false}
      - VISION_MODEL=${VISION_MODEL:-openai/clip-vit-base-patch32}
      - VISION_CAPTURE_INTERVAL=${VISION_CAPTURE_INTERVAL:-0}
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      - VISION_STORE_FRAMES=${VISION_STORE_FRAMES:-false}
      - REDIS_URL=${REDIS_URL}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - NEOCORTEX_URL=${NEOCORTEX_URL}
      - WORKING_MEMORY_URL=${WORKING_MEMORY_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
    volumes:
      - frames-volume:/workspace/frames
      - models-volume:/models
    # ── CAMERA: uncomment if you have a USB camera ─────────────────────────
    # If /dev/video0 does not exist, this service will fail to start.
    # Remove or comment the devices section if running on a server.
    # devices:
    #   - /dev/video0:/dev/video0
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    <<: [*common-network, *common-restart, *common-extra-hosts]
    deploy:
      resources:
        limits:
          memory: ${VISION_MAX_MEMORY:-4g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8017/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Dashboard (monitoring & control UI) ─────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: brain_dashboard
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      - THALAMUS_URL=http://thalamus:8000
      - KNOBS_URL=http://knobs:8090
      - REDIS_URL=${REDIS_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    <<: [*common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
      thalamus:
        condition: service_healthy
      knobs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      <<: *common-healthcheck

  # ═══════════════════════════════════════════════════════════════════════════
  # AUTONOMY — Self-Reflective Thinking and Continuous Improvement
  # ═══════════════════════════════════════════════════════════════════════════
  autonomy:
    build:
      context: .
      dockerfile: services/autonomy/Dockerfile
    container_name: brain_autonomy
    environment:
      - REDIS_URL=${REDIS_URL}
      - THALAMUS_URL=${THALAMUS_URL}
      - KNOBS_URL=${KNOBS_URL}
      - SELF_UPDATE_URL=${SELF_UPDATE_URL}
      - AUTONOMY_MAX_RISK=${AUTONOMY_MAX_RISK:-low}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_MAIN_MODEL=${ANTHROPIC_MAIN_MODEL:-claude-sonnet-4-20250514}
      - ANTHROPIC_FAST_MODEL=${ANTHROPIC_FAST_MODEL:-claude-haiku-4-5-20251001}
      - OPENAI_MAIN_MODEL=${OPENAI_MAIN_MODEL:-gpt-5.4-mini}
      - OPENAI_FAST_MODEL=${OPENAI_FAST_MODEL:-gpt-5.4-nano}
      - OLLAMA_URL=${OLLAMA_URL}
    depends_on:
      redis:
        condition: service_healthy
      knobs:
        condition: service_healthy
    <<: [*common-network, *common-restart, *common-extra-hosts]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8018/health')"]
      <<: *common-healthcheck

  # ═══════════════════════════════════════════════════════════════════════════
  # HORMONAL / INSIGHT SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Hypothalamus (hormonal state engine — lightweight, Redis-only) ────────
  hypothalamus:
    build:
      context: .
      dockerfile: services/hypothalamus/Dockerfile
    container_name: brain_hypothalamus
    <<: [*common-env, *common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8019/health')"]
      <<: *common-healthcheck

  # ── Insight Engine (epiphany detection — background graph analysis) ──────
  insight-engine:
    build:
      context: .
      dockerfile: services/insight-engine/Dockerfile
    container_name: brain_insight_engine
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEOCORTEX_URL=${NEOCORTEX_URL}
      - KNOBS_URL=${KNOBS_URL}
    <<: [*common-env, *common-network, *common-restart]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      <<: *common-healthcheck

  # ── Embed Queue (centralized embedding — Redis Streams MQ + cache) ─────
  # All embedding calls go through this service instead of hitting Ollama directly.
  # Provides: Redis cache (6h TTL), in-flight dedup, async queue via Redis Streams.
  # Docker logs show every Ollama call with timing, source service, and cache status.
  embed-queue:
    build:
      context: .
      dockerfile: services/embed-queue/Dockerfile
    container_name: brain_embed_queue
    environment:
      - REDIS_URL=${REDIS_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - EMBED_CACHE_TTL=${EMBED_CACHE_TTL:-21600}
      - EMBED_QUEUE_WORKERS=${EMBED_QUEUE_WORKERS:-2}
    <<: [*common-network, *common-restart, *common-extra-hosts]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8021/health')"]
      <<: *common-healthcheck

  # ═══════════════════════════════════════════════════════════════════════════
  # THALAMUS — Master Orchestrator (starts last, depends on everything)
  # ═══════════════════════════════════════════════════════════════════════════
  thalamus:
    build:
      context: .
      dockerfile: services/thalamus/Dockerfile
    container_name: brain_thalamus
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_MAIN_MODEL=${ANTHROPIC_MAIN_MODEL:-claude-sonnet-4-20250514}
      - ANTHROPIC_FAST_MODEL=${ANTHROPIC_FAST_MODEL:-claude-haiku-4-5-20251001}
      - OPENAI_MAIN_MODEL=${OPENAI_MAIN_MODEL:-gpt-5.4-mini}
      - OPENAI_FAST_MODEL=${OPENAI_FAST_MODEL:-gpt-5.4-nano}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MAIN_MODEL=${GEMINI_MAIN_MODEL:-gemini-2.5-pro}
      - GEMINI_FAST_MODEL=${GEMINI_FAST_MODEL:-gemini-2.0-flash}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MAIN_MODEL=${DEEPSEEK_MAIN_MODEL:-deepseek-r1}
      - DEEPSEEK_FAST_MODEL=${DEEPSEEK_FAST_MODEL:-deepseek-chat}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MAIN_MODEL=${GROQ_MAIN_MODEL:-llama-3.3-70b-versatile}
      - GROQ_FAST_MODEL=${GROQ_FAST_MODEL:-llama-3.1-8b-instant}
      - XAI_API_KEY=${XAI_API_KEY}
      - XAI_MAIN_MODEL=${XAI_MAIN_MODEL:-grok-4-20}
      - XAI_FAST_MODEL=${XAI_FAST_MODEL:-grok-3-mini-fast}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MAIN_MODEL=${OPENROUTER_MAIN_MODEL}
      - OPENROUTER_FAST_MODEL=${OPENROUTER_FAST_MODEL}
      - GENERIC_API_KEY=${GENERIC_API_KEY}
      - GENERIC_BASE_URL=${GENERIC_BASE_URL}
      - GENERIC_MAIN_MODEL=${GENERIC_MAIN_MODEL}
      - GENERIC_FAST_MODEL=${GENERIC_FAST_MODEL}
      - MAX_TOKENS_MAIN=${MAX_TOKENS_MAIN:-0}
      - MAX_TOKENS_FAST=${MAX_TOKENS_FAST:-0}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - REDIS_URL=${REDIS_URL}
      - AMYGDALA_URL=${AMYGDALA_URL}
      - HIPPOCAMPUS_URL=${HIPPOCAMPUS_URL}
      - CEREBELLUM_URL=${CEREBELLUM_URL}
      - NEOCORTEX_URL=${NEOCORTEX_URL}
      - WORKING_MEMORY_URL=${WORKING_MEMORY_URL}
      - PERCEPTION_URL=${PERCEPTION_URL}
      - VERIFICATION_URL=${VERIFICATION_URL}
      - CROSS_DOMAIN_URL=${CROSS_DOMAIN_URL}
      - COMPASS_URL=${COMPASS_URL}
      - FRAMEWORK_ROUTER_URL=${FRAMEWORK_ROUTER_URL}
      - SELF_UPDATE_URL=${SELF_UPDATE_URL}
      - KNOBS_URL=${KNOBS_URL}
      - CAUSAL_GRAPH_URL=${CAUSAL_GRAPH_URL}
      - SIMULATOR_URL=${SIMULATOR_URL}
      - METACOGNITION_URL=${METACOGNITION_URL}
      - GOALS_URL=${GOALS_URL}
      - LEARNER_URL=${LEARNER_URL}
      - VISION_URL=${VISION_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - HYPOTHALAMUS_URL=${HYPOTHALAMUS_URL}
      - INSIGHT_ENGINE_URL=${INSIGHT_ENGINE_URL}
      - EMBED_QUEUE_URL=${EMBED_QUEUE_URL}
    <<: [*common-network, *common-restart, *common-extra-hosts]
    depends_on:
      amygdala:
        condition: service_healthy
      hippocampus:
        condition: service_healthy
      neocortex:
        condition: service_healthy
      cerebellum:
        condition: service_healthy
      working-memory:
        condition: service_healthy
      perception:
        condition: service_healthy
      verification:
        condition: service_healthy
      cross-domain:
        condition: service_healthy
      compass:
        condition: service_healthy
      framework-router:
        condition: service_healthy
      knobs:
        condition: service_healthy
      self-update:
        condition: service_healthy
      causal-graph:
        condition: service_healthy
      simulator:
        condition: service_healthy
      metacognition:
        condition: service_healthy
      goals:
        condition: service_healthy
      learner:
        condition: service_healthy
      hypothalamus:
        condition: service_healthy
      insight-engine:
        condition: service_healthy
      embed-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 30s

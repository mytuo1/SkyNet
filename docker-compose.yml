version: "3.9"

networks:
  brain-net:
    driver: bridge

volumes:
  edgedb-data:
  elasticsearch-data:
  redis-data:
  models-volume:          # local models (Phi-4-mini, emotion classifier)
  workspace-volume:       # training logs, replay buffer, code changes
  frames-volume:          # captured vision frames

services:

  # ═══════════════════════════════════════════════════════════════════
  # API GATEWAY
  # ═══════════════════════════════════════════════════════════════════
  gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [thalamus, knobs, self-update]
    networks: [brain-net]
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # DATABASES
  # ═══════════════════════════════════════════════════════════════════
  redis:
    build:
      context: .
      dockerfile: databases/redis/Dockerfile
    volumes:
      - redis-data:/data
    networks: [brain-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    build:
      context: .
      dockerfile: databases/elasticsearch/Dockerfile
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}
      - cluster.name=brain-neocortex
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks: [brain-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 12

  edgedb:
    build:
      context: .
      dockerfile: databases/edgedb/Dockerfile
    environment:
      - EDGEDB_SERVER_SECURITY=insecure_dev_mode
      - EDGEDB_SERVER_BIND_ADDRESS=0.0.0.0
    volumes:
      - edgedb-data:/var/lib/edgedb/data
      - ./databases/edgedb/schema:/dbschema
    networks: [brain-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "edgedb query --dsn edgedb://edgedb/main 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 12

  # Database initialization (runs once, then exits)
  db-init:
    image: python:3.12-slim
    command: >
      sh -c "pip install -q redis elasticsearch edgedb &&
             python /init/redis/init.py &&
             python /init/elasticsearch/init.py &&
             python /init/edgedb/init.py &&
             echo 'All databases initialized'"
    volumes:
      - ./databases:/init
    environment:
      - REDIS_URL=${REDIS_URL}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - EDGEDB_DSN=${EDGEDB_DSN}
    networks: [brain-net]
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      edgedb:
        condition: service_healthy
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════
  # CORE BRAIN REGIONS
  # ═══════════════════════════════════════════════════════════════════
  amygdala:
    build:
      context: .
      dockerfile: services/amygdala/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 10s
      retries: 5

  hippocampus:
    build:
      context: .
      dockerfile: services/hippocampus/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis:          {condition: service_healthy}
      elasticsearch:  {condition: service_healthy}
      edgedb:         {condition: service_healthy}
      db-init:        {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 10s
      retries: 5

  neocortex:
    build:
      context: .
      dockerfile: services/neocortex/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      elasticsearch: {condition: service_healthy}
      redis:         {condition: service_healthy}
      db-init:       {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8004/health"]
      interval: 10s
      retries: 5

  cerebellum:
    build:
      context: .
      dockerfile: services/cerebellum/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      edgedb: {condition: service_healthy}
      redis:  {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/health"]
      interval: 10s
      retries: 5

  working-memory:
    build:
      context: .
      dockerfile: services/working-memory/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8005/health"]
      interval: 10s
      retries: 5

  perception:
    build:
      context: .
      dockerfile: services/perception/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis:     {condition: service_healthy}
      neocortex: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8006/health"]
      interval: 10s
      retries: 5

  verification:
    build:
      context: .
      dockerfile: services/verification/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis:     {condition: service_healthy}
      neocortex: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8007/health"]
      interval: 10s
      retries: 5

  cross-domain:
    build:
      context: .
      dockerfile: services/cross-domain/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis:     {condition: service_healthy}
      neocortex: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8008/health"]
      interval: 10s
      retries: 5

  compass:
    build:
      context: .
      dockerfile: services/compass/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8009/health"]
      interval: 10s
      retries: 5

  framework-router:
    build:
      context: .
      dockerfile: services/framework-router/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8010/health"]
      interval: 10s
      retries: 5

  knobs:
    build:
      context: .
      dockerfile: services/knobs/Dockerfile
    env_file: .env
    ports:
      - "8090:8090"
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 10s
      retries: 5

  self-update:
    build:
      context: .
      dockerfile: services/self-update/Dockerfile
    env_file: .env
    volumes:
      - workspace-volume:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services:/app/../services   # can read/write service files
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
      knobs: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8011/health"]
      interval: 10s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════
  # NEW COGNITIVE SERVICES
  # ═══════════════════════════════════════════════════════════════════
  causal-graph:
    build:
      context: .
      dockerfile: services/causal-graph/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8012/health"]
      interval: 10s
      retries: 5

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8013/health"]
      interval: 10s
      retries: 5

  metacognition:
    build:
      context: .
      dockerfile: services/metacognition/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis:     {condition: service_healthy}
      neocortex: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8014/health"]
      interval: 10s
      retries: 5

  goals:
    build:
      context: .
      dockerfile: services/goals/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8015/health"]
      interval: 10s
      retries: 5

  learner:
    build:
      context: .
      dockerfile: services/learner/Dockerfile
    env_file: .env
    volumes:
      - models-volume:/models
      - workspace-volume:/workspace
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: ${LEARNER_MAX_MEMORY:-8g}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8016/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  vision:
    build:
      context: .
      dockerfile: services/vision/Dockerfile
    env_file: .env
    volumes:
      - frames-volume:/workspace/frames
      - models-volume:/models
    devices:
      - /dev/video0:/dev/video0   # USB camera (remove if no camera)
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      redis:         {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: ${VISION_MAX_MEMORY:-4g}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8017/health"]
      interval: 15s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════
  # THALAMUS — LAST (depends on everything)
  # ═══════════════════════════════════════════════════════════════════
  thalamus:
    build:
      context: .
      dockerfile: services/thalamus/Dockerfile
    env_file: .env
    networks: [brain-net]
    restart: unless-stopped
    depends_on:
      amygdala:       {condition: service_healthy}
      hippocampus:    {condition: service_healthy}
      neocortex:      {condition: service_healthy}
      cerebellum:     {condition: service_healthy}
      working-memory: {condition: service_healthy}
      perception:     {condition: service_healthy}
      verification:   {condition: service_healthy}
      cross-domain:   {condition: service_healthy}
      compass:        {condition: service_healthy}
      framework-router:{condition: service_healthy}
      knobs:          {condition: service_healthy}
      causal-graph:   {condition: service_healthy}
      simulator:      {condition: service_healthy}
      metacognition:  {condition: service_healthy}
      goals:          {condition: service_healthy}
      learner:        {condition: service_healthy}
      vision:         {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      retries: 5
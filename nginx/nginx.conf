# nginx/nginx.conf
# ── Brain System API Gateway ──────────────────────────────────────────────────
#
# All external traffic enters here on port 80 (mapped to host GATEWAY_PORT).
# Routes requests to the correct internal service by URL prefix.
#
# INTERNAL NETWORK:
#   Every service is reachable by its container name on the brain-net network.
#   Ports listed here are INTERNAL container ports, not host-exposed ports.
#
# DNS NOTE:
#   We use Docker's embedded DNS (127.0.0.11) with variable-based proxy_pass
#   so nginx resolves hostnames at *request time*, not at startup.
#   This prevents nginx from crashing when optional or slow-starting services
#   aren't in DNS yet.
#
# URL STRUCTURE:
#   POST /brain/process             → thalamus (main cognitive pipeline)
#   GET  /health                    → thalamus (full brain health check)
#   ANY  /knobs/*                   → knobs service (behavioral parameters)
#   ANY  /update/*                  → self-update (supergrokie code modification)
#   ANY  /brain/<service>/*         → that specific service (direct access)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $request_method "$request" '
                    '$status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;    # allow image uploads for vision service

    # ── Main server ───────────────────────────────────────────────────────────

    server {
        listen 80;
        server_name _;

        # Docker-internal DNS — resolve container names at request time
        resolver 127.0.0.11 valid=30s ipv6=off;

        # ── Global health check ───────────────────────────────────────────────
        # Full brain health — returns status of all 21 services
        # Exact match — original URI /health is forwarded as-is (no rewrite needed)
        location = /health {
            set $thalamus http://thalamus:8000;
            proxy_pass $thalamus;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── Main cognitive pipeline ───────────────────────────────────────────
        # Primary entry point — every user interaction goes through here
        location = /brain/process {
            set $thalamus http://thalamus:8000;
            rewrite ^ /process break;
            proxy_pass $thalamus;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    180s;   # complex reasoning takes time
            proxy_send_timeout    180s;
        }

        # ── Teacher mode — emotion correction endpoint ──────────────────────
        location = /brain/teach-emotion {
            set $thalamus http://thalamus:8000;
            rewrite ^ /teach-emotion break;
            proxy_pass $thalamus;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── Recent learnings ─────────────────────────────────────────────────
        location = /brain/recent-learnings {
            set $thalamus http://thalamus:8000;
            rewrite ^ /recent-learnings break;
            proxy_pass $thalamus;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    15s;
            proxy_send_timeout    15s;
        }

        # ── Knobs (behavioral parameters) ────────────────────────────────────
        # GET  /knobs/current           — all current values
        # GET  /knobs/current/<name>    — single knob value
        # PUT  /knobs/set               — set all knobs
        # PATCH /knobs/adjust           — adjust one knob
        # PATCH /knobs/adjust-many      — adjust multiple
        # POST /knobs/preset/<name>     — apply preset
        # POST /knobs/preset/save/<name>— save custom preset
        # DELETE /knobs/preset/<name>   — delete custom preset
        # GET  /knobs/presets           — list all presets
        # GET  /knobs/history           — change history
        # POST /knobs/history/rollback  — rollback
        # POST /knobs/reset             — factory defaults
        # GET  /knobs/describe/<name>   — describe a knob
        location /knobs/ {
            set $knobs http://knobs:8090;
            rewrite ^/knobs/(.*) /$1 break;
            proxy_pass $knobs;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── Self-Update and supergrokie code modification ────────────────────────────
        # POST /update/webhook/supergrokie    — Supergrokie webhook (natural language)
        # POST /update/update                 — structured update (code/knobs/service)
        # POST /update/modify-code            — supergrokie modifies existing service
        # POST /update/generate-service       — supergrokie generates new microservice
        # POST /update/self-analyze           — brain analyzes its own experiences
        # GET  /update/supergrokie-status     — supergrokie health check
        # GET  /update/pending                — pending code changes for review
        # POST /update/approve/<id>           — approve a pending change
        # DELETE /update/pending/<id>         — reject a pending change
        # GET  /update/change-log             — history of all applied changes
        location /update/ {
            set $self_update http://self-update:8011;
            rewrite ^/update/(.*) /$1 break;
            proxy_pass $self_update;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    300s;   # supergrokie code generation can take a while
            proxy_send_timeout    300s;
        }

        # ── Direct service access (for debugging and admin) ───────────────────
        # These expose individual services through the gateway.
        # In production you may want to restrict these with auth.

        location /brain/thalamus/ {
            set $thalamus http://thalamus:8000;
            rewrite ^/brain/thalamus/(.*) /$1 break;
            proxy_pass $thalamus;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    180s;
            proxy_send_timeout    60s;
        }

        location /brain/amygdala/ {
            set $amygdala http://amygdala:8001;
            rewrite ^/brain/amygdala/(.*) /$1 break;
            proxy_pass $amygdala;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /brain/hippocampus/ {
            set $hippocampus http://hippocampus:8002;
            rewrite ^/brain/hippocampus/(.*) /$1 break;
            proxy_pass $hippocampus;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /brain/neocortex/ {
            set $neocortex http://neocortex:8004;
            rewrite ^/brain/neocortex/(.*) /$1 break;
            proxy_pass $neocortex;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /brain/cerebellum/ {
            set $cerebellum http://cerebellum:8003;
            rewrite ^/brain/cerebellum/(.*) /$1 break;
            proxy_pass $cerebellum;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /brain/working-memory/ {
            set $working_memory http://working-memory:8005;
            rewrite ^/brain/working-memory/(.*) /$1 break;
            proxy_pass $working_memory;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        location /brain/perception/ {
            set $perception http://perception:8006;
            rewrite ^/brain/perception/(.*) /$1 break;
            proxy_pass $perception;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /brain/verification/ {
            set $verification http://verification:8007;
            rewrite ^/brain/verification/(.*) /$1 break;
            proxy_pass $verification;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /brain/cross-domain/ {
            set $cross_domain http://cross-domain:8008;
            rewrite ^/brain/cross-domain/(.*) /$1 break;
            proxy_pass $cross_domain;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /brain/compass/ {
            set $compass http://compass:8009;
            rewrite ^/brain/compass/(.*) /$1 break;
            proxy_pass $compass;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /brain/framework-router/ {
            set $framework http://framework-router:8010;
            rewrite ^/brain/framework-router/(.*) /$1 break;
            proxy_pass $framework;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    300s;   # swarm/colony can run long
            proxy_send_timeout    300s;
        }

        location /brain/causal-graph/ {
            set $causal_graph http://causal-graph:8012;
            rewrite ^/brain/causal-graph/(.*) /$1 break;
            proxy_pass $causal_graph;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /brain/simulator/ {
            set $simulator http://simulator:8013;
            rewrite ^/brain/simulator/(.*) /$1 break;
            proxy_pass $simulator;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;    # sandboxed execution has a hard limit
            proxy_send_timeout    30s;
        }

        location /brain/metacognition/ {
            set $metacognition http://metacognition:8014;
            rewrite ^/brain/metacognition/(.*) /$1 break;
            proxy_pass $metacognition;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /brain/goals/ {
            set $goals http://goals:8015;
            rewrite ^/brain/goals/(.*) /$1 break;
            proxy_pass $goals;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        location /brain/learner/ {
            set $learner http://learner:8016;
            rewrite ^/brain/learner/(.*) /$1 break;
            proxy_pass $learner;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    600s;   # training cycles run in background
            proxy_send_timeout    600s;
        }

        location /brain/vision/ {
            set $vision http://vision:8017;
            rewrite ^/brain/vision/(.*) /$1 break;
            proxy_pass $vision;
            include /etc/nginx/proxy_params.conf;
            client_max_body_size 50M;     # image uploads can be large
            proxy_connect_timeout 10s;
            proxy_read_timeout    120s;   # CLIP processing takes a moment
            proxy_send_timeout    60s;
        }

        # ── Static dashboard UI ──────────────────────────────────────────────
        # Pure HTML/JS chat interface — no Python needed
        location = / {
            root /usr/share/nginx/html;
            index index.html;
        }
        location /index.html {
            root /usr/share/nginx/html;
        }

        # ── Dashboard API (metrics, logs, WebSocket) ─────────────────────────
        location /api/ {
            set $dashboard http://dashboard:8080;
            proxy_pass $dashboard;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── Dashboard WebSocket ──────────────────────────────────────────────
        location /ws/ {
            set $dashboard http://dashboard:8080;
            proxy_pass $dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # ── Full dashboard (Python-served pages: monitoring, logging, controls) ─
        location /dashboard {
            set $dashboard http://dashboard:8080;
            rewrite ^/dashboard$ / break;
            rewrite ^/dashboard/(.*) /$1 break;
            proxy_pass $dashboard;
            include /etc/nginx/proxy_params.conf;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── 404 fallback ──────────────────────────────────────────────────────
        location / {
            return 404 '{"error":"not found","available_paths":["/","/health","/brain/process","/knobs/","/update/","/dashboard","/api/","/brain/<service>/"]}';
            add_header Content-Type application/json;
        }
    }
}

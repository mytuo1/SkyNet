events {
    worker_connections 1024;
}

http {
    # ── Upstream brain regions ─────────────────────────────────────────────────
    upstream thalamus       { server thalamus:8000; }
    upstream knobs          { server knobs:8090; }
    upstream self_update    { server self-update:8011; }
    upstream perception     { server perception:8006; }
    upstream amygdala       { server amygdala:8001; }
    upstream hippocampus    { server hippocampus:8002; }
    upstream cerebellum     { server cerebellum:8003; }
    upstream neocortex      { server neocortex:8004; }
    upstream working_memory { server working-memory:8005; }
    upstream verification   { server verification:8007; }
    upstream cross_domain   { server cross-domain:8008; }
    upstream compass        { server compass:8009; }
    upstream framework      { server framework-router:8010; }

    # Request ID for tracing
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 80;

        # ── Main brain input ──────────────────────────────────────────────────
        location /brain/ {
            proxy_pass         http://thalamus/;
            proxy_set_header   X-Request-ID $request_id_final;
            proxy_set_header   Host $host;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Knobs control panel ───────────────────────────────────────────────
        location /knobs/ {
            proxy_pass       http://knobs/;
            proxy_set_header Host $host;
        }

        # ── Self-update and OpenClaw webhook ──────────────────────────────────
        location /update/ {
            proxy_pass         http://self_update/;
            proxy_set_header   Host $host;
            proxy_read_timeout 120s;
        }

        # ── Individual region access (for debugging / direct calls) ───────────
        location /amygdala/       { proxy_pass http://amygdala/; }
        location /hippocampus/    { proxy_pass http://hippocampus/; }
        location /cerebellum/     { proxy_pass http://cerebellum/; }
        location /neocortex/      { proxy_pass http://neocortex/; }
        location /working-memory/ { proxy_pass http://working_memory/; }
        location /perception/     { proxy_pass http://perception/; }
        location /verification/   { proxy_pass http://verification/; }
        location /cross-domain/   { proxy_pass http://cross_domain/; }
        location /compass/        { proxy_pass http://compass/; }
        location /framework/      { proxy_pass http://framework/; }

        # ── System health ─────────────────────────────────────────────────────
        location /health {
            proxy_pass http://thalamus/health;
        }

        # ── Docs (aggregated) ─────────────────────────────────────────────────
        location /docs {
            proxy_pass http://thalamus/docs;
        }
    }
}

# nginx/proxy_params.conf
# Shared proxy headers included by every location block.
# Include with: include /etc/nginx/proxy_params.conf;
#
# NOTE: Timeout directives are NOT set here because many location blocks
# need custom overrides (e.g. 180s for thalamus, 300s for self-update).
# nginx treats a second proxy_read_timeout in the same block as a duplicate
# directive and refuses to start.  Each location block sets its own timeouts.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version                 1.1;
proxy_set_header Connection        "";
